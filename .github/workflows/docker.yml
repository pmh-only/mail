name: Build Docker images

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  web:
    name: Build web image
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: mail
      target: runtime
      tags: type=raw,value=latest

  worker:
    name: Build worker image
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: mail-worker
      target: worker
      tags: type=raw,value=latest
