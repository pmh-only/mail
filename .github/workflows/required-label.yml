name: Validate pull request labels

on:
  pull_request:
    types: [labeled, unlabeled, ready_for_review]

permissions:
  pull-requests: read

jobs:
  require-area-label:
    runs-on: ubuntu-latest
    steps:
      - name: Require an area label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((label) => label.name);
            if (!labels.some((label) => label.startsWith('area:'))) {
              core.setFailed('Pull requests must have at least one area: label.');
            }
