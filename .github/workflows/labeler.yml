name: Label pull requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Create required labels
        uses: actions/github-script@v9
        with:
          script: |
            const labels = [
              ['area: web', '1d76db', 'Svelte pages and components'],
              ['area: server', '5319e7', 'Server routes and services'],
              ['area: worker', 'fbca04', 'Background worker'],
              ['area: database', '006b75', 'Database schema and migrations'],
              ['area: documentation', '0075ca', 'Documentation'],
              ['area: github', '000000', 'GitHub configuration and automation'],
              ['area: project', '5b738c', 'Project and deployment configuration'],
              ['dependencies', '0366d6', 'Dependency updates'],
              ['tests', 'bfdadc', 'Test changes'],
              ['size: XS', 'c2e0c6', 'Fewer than 10 changed lines'],
              ['size: S', '7fca9e', '10 to 99 changed lines'],
              ['size: M', 'f9d0c4', '100 to 499 changed lines'],
              ['size: L', 'fef2c0', '500 to 999 changed lines'],
              ['size: XL', 'b60205', '1,000 or more changed lines'],
            ];

            for (const [name, color, description] of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name,
                  color,
                  description,
                });
              }
            }

      - name: Apply labels from changed files
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Apply pull request size label
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequest = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            const changedLines = pullRequest.data.additions + pullRequest.data.deletions;
            const size = changedLines < 10 ? 'size: XS'
              : changedLines < 100 ? 'size: S'
                : changedLines < 500 ? 'size: M'
                  : changedLines < 1000 ? 'size: L'
                    : 'size: XL';
            const existingLabels = pullRequest.data.labels
              .map((label) => typeof label === 'string' ? label : label.name)
              .filter((name) => name.startsWith('size:'));

            if (existingLabels.length) {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.issue.number,
                name: existingLabels[0],
              });
              await Promise.all(existingLabels.slice(1).map((name) =>
                github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: context.issue.number,
                  name,
                })
              ));
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: [size],
            });

      - name: Require an area label
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequest = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            const labels = pullRequest.data.labels.map((label) =>
              typeof label === 'string' ? label : label.name
            );

            if (!labels.some((label) => label.startsWith('area:'))) {
              core.setFailed('Pull requests must have at least one area: label.');
            }
